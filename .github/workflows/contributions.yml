name: Refresh contribution calendar

on:
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/contributions.py
      - scripts/test_contributions.py
      - .github/workflows/contributions.yml
  pull_request:
    paths:
      - scripts/contributions.py
      - scripts/test_contributions.py
      - .github/workflows/contributions.yml

permissions:
  contents: read

concurrency:
  group: contribution-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v

  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate both themes from the public calendar
        run: python scripts/contributions.py --user 32KZ
      - name: Commit changed calendars
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/contributions-dark.svg assets/contributions-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh contribution calendar"
            git push origin HEAD:main
          fi
